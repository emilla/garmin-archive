[project]
name = "garmin-archive"
version = "0.1.0"
description = "Nightly archive of Garmin Connect data into PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
garmin-archive = "garmin_archive.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
